<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد ISSPanel</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
        type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>

<body>
    <div class="max-w-6xl mx-auto p-3">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-base-300 rounded my-4 shadow p-3">
            <div class="flex items-center gap-2">
                <img src="https://avatars.githubusercontent.com/u/49550675?v=4" alt="" class="w-16 h-16 rounded-full">
                <h1 class="text-xl md:text-2xl font-bold">پنل مدیریت ISSPanel (Panel / Inbound / User)</h1>
            </div>
            <div class="flex gap-2">
                <a href="https://www.youtube.com/@isatisstack" target="_blank" class="btn btn-error rounded-full">یوتیوب</a>
                <a href="https://t.me/isatisstackteam" target="_blank" class="btn btn-info rounded-full">تلگرام</a>
                <a href="/logout" class="btn">خروج</a>
            </div>
        </div>

        <div class="my-4 bg-red-500 rounded-lg p-3 shadow text-white text-sm">
            توجه: ابتدا پنل بساز → بعد اینباند بساز → بعد کاربر بساز → در نهایت دسترسی کاربر به اینباندها را مشخص کن.
        </div>

        <!-- Actions -->
        <div class="grid md:grid-cols-3 gap-3 my-4">
            <button class="btn btn-primary" onclick="panel_modal.showModal()">+ افزودن پنل</button>
            <button class="btn btn-secondary" onclick="inbound_modal.showModal()">+ افزودن اینباند</button>
            <button class="btn btn-success" onclick="user_modal.showModal()">+ افزودن کاربر و دسترسی</button>
        </div>

        <!-- Add Panel Modal -->
        <dialog id="panel_modal" class="modal">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-3">افزودن پنل</h3>
                <form id="panelForm" class="space-y-3">
                    <div>
                        <label class="label">نام پنل</label>
                        <input name="name" class="input input-bordered w-full" required />
                    </div>
                    <div>
                        <label class="label">آدرس پنل (domain)</label>
                        <input name="address" class="input input-bordered w-full" onclick="this.value = get_host()" required />
                    </div>
                    <button class="btn btn-primary w-full" type="submit">ثبت پنل</button>
                </form>
                <form method="dialog" class="mt-3"><button class="btn w-full">بستن</button></form>
            </div>
        </dialog>

        <!-- Add Inbound Modal -->
        <dialog id="inbound_modal" class="modal">
            <div class="modal-box max-w-3xl">
                <h3 class="font-bold text-lg mb-3">افزودن اینباند</h3>
                <form id="inboundForm" class="grid md:grid-cols-2 gap-3">
                    <div class="md:col-span-2">
                        <label class="label">انتخاب پنل</label>
                        <select name="panel_id" id="inbound_panel_id" class="select select-bordered w-full" required></select>
                    </div>
                    <div>
                        <label class="label">Tag (اختیاری)</label>
                        <input name="tag" class="input input-bordered w-full" placeholder="inb-tehran-1" />
                    </div>
                    <div>
                        <label class="label">Port (External)</label>
                        <input name="port" class="input input-bordered w-full" value="443" required />
                    </div>
                    <div>
                        <label class="label">Protocol</label>
                        <select name="protocol" class="select select-bordered w-full">
                            <option value="ws">ws</option>
                            <option value="xhttp">xhttp</option>
                            <option value="grpc">grpc</option>
                        </select>
                    </div>
                    <div>
                        <label class="label">Host (SNI)</label>
                        <input name="host" class="input input-bordered w-full" onclick="this.value = get_host()" required />
                    </div>
                    <div>
                        <label class="label">Path</label>
                        <input name="path" class="input input-bordered w-full" placeholder="/edge-1" required />
                    </div>
                    <div>
                        <label class="label">TLS</label>
                        <select name="tls" class="select select-bordered w-full">
                            <option value="tls" selected>tls</option>
                            <option value="none">none</option>
                        </select>
                    </div>
                    <div>
                        <label class="label">Fingerprint</label>
                        <select name="fp" class="select select-bordered w-full">
                            <option value="chrome">chrome</option>
                            <option value="firefox">firefox</option>
                            <option value="ios">ios</option>
                            <option value="random">random</option>
                            <option value="randomized">randomized</option>
                        </select>
                    </div>
                    <div>
                        <label class="label">ALPN</label>
                        <select name="alpn" class="select select-bordered w-full">
                            <option value="http/1.1" selected>http/1.1</option>
                            <option value="h2">h2</option>
                            <option value="h3">h3</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <button class="btn btn-secondary w-full" type="submit">ثبت اینباند</button>
                    </div>
                </form>
                <form method="dialog" class="mt-3"><button class="btn w-full">بستن</button></form>
            </div>
        </dialog>

        <!-- Add User + Access Modal -->
        <dialog id="user_modal" class="modal">
            <div class="modal-box max-w-4xl">
                <h3 class="font-bold text-lg mb-3">افزودن کاربر و تعیین دسترسی</h3>
                <form id="userForm" class="space-y-3">
                    <div class="grid md:grid-cols-2 gap-3">
                        <div>
                            <label class="label">نام کاربری</label>
                            <input name="username" class="input input-bordered w-full" required />
                        </div>
                        <div>
                            <label class="label">UUID</label>
                            <div class="flex gap-2">
                                <input name="uuid" id="new_user_uuid" class="input input-bordered w-full" required />
                                <button type="button" class="btn btn-warning" onclick="generateUUID('new_user_uuid')">ساخت UUID</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="label">دسترسی به اینباندها</label>
                        <div id="inboundsCheckboxes" class="grid md:grid-cols-2 gap-2 max-h-72 overflow-auto border rounded p-3 bg-base-200"></div>
                    </div>

                    <button class="btn btn-success w-full" type="submit">ثبت کاربر + ذخیره دسترسی</button>
                </form>
                <form method="dialog" class="mt-3"><button class="btn w-full">بستن</button></form>
            </div>
        </dialog>

        <!-- Table -->
        <h2 class="text-xl font-bold mt-8 mb-4">لیست کاربران و دسترسی‌ها</h2>
        <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
            <table class="table table-zebra">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>کاربر</th>
                        <th>UUID</th>
                        <th>اینباندهای مجاز</th>
                        <th>لینک‌ها</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>

        <div id="result" class="mt-6 hidden bg-gray-800 text-white p-4 rounded-lg shadow-lg">
            <h3 class="text-lg font-bold mb-2">نتیجه:</h3>
            <pre id="resultText" class="text-xs whitespace-pre-wrap"></pre>
        </div>
    </div>

    <script>
        let panels = [];
        let inbounds = [];

        function get_host() {
            return window.location.host;
        }

        function generateUUID(inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.value = crypto.randomUUID();
        }

        function showResult(obj) {
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('resultText').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
        }

        async function api(url, options = {}) {
            const res = await fetch(url, options);
            if (!res.ok) {
                const txt = await res.text();
                throw new Error(txt || `HTTP ${res.status}`);
            }
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) return res.json();
            return res.text();
        }

        async function loadPanels() {
            panels = await api('/api/panels');
            const sel = document.getElementById('inbound_panel_id');
            sel.innerHTML = '';
            panels.forEach(p => {
                const op = document.createElement('option');
                op.value = p.id;
                op.textContent = `${p.name} (${p.address})`;
                sel.appendChild(op);
            });
        }

        async function loadInbounds() {
            inbounds = await api('/api/inbounds');
            const box = document.getElementById('inboundsCheckboxes');
            box.innerHTML = '';

            if (!inbounds.length) {
                box.innerHTML = '<div class="text-sm text-error">اینباندی ثبت نشده است.</div>';
                return;
            }

            inbounds.forEach(i => {
                const label = document.createElement('label');
                label.className = 'label cursor-pointer justify-start gap-2 border rounded px-2 py-1 bg-base-100';
                label.innerHTML = `
          <input type="checkbox" class="checkbox checkbox-sm inbound-checkbox" value="${i.id}">
          <span class="text-sm">
            [Panel: ${i.panel_name}] ${i.tag || '-'} | ${i.protocol} | ${i.host}${i.path} | port:${i.port}
          </span>
        `;
                box.appendChild(label);
            });
        }

        async function loadUsersAccess() {
            const data = await api('/api/users-with-access');
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            data.forEach((u, idx) => {
                const linksHtml = (u.links || []).map(l => `
          <button class="btn btn-xs btn-info m-1" onclick='copyText(${JSON.stringify(l.link)})'>
            کپی ${l.protocol} ${l.host}${l.path}
          </button>
        `).join('');

                const inboundsHtml = (u.inbounds || []).map(i =>
                    `<span class="badge badge-outline m-1">${i.panel_name} | ${i.protocol} | ${i.host}${i.path}</span>`
                ).join('');

                tbody.innerHTML += `
          <tr>
            <td>${idx + 1}</td>
            <td>${u.username}</td>
            <td class="text-xs">${u.uuid}</td>
            <td>${inboundsHtml || '-'}</td>
            <td>${linksHtml || '-'}</td>
          </tr>
        `;
            });
        }

        async function refreshAll() {
            await loadPanels();
            await loadInbounds();
            await loadUsersAccess();
        }

        // Panel form
        document.getElementById('panelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);
            try {
                const r = await api('/api/panels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                showResult(r);
                e.target.reset();
                await refreshAll();
            } catch (err) {
                alert('خطا در ساخت پنل: ' + err.message);
            }
        });

        // Inbound form
        document.getElementById('inboundForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);
            const panelId = data.panel_id;
            delete data.panel_id;
            try {
                const r = await api(`/api/panels/${panelId}/inbounds`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                showResult(r);
                e.target.reset();
                await refreshAll();
            } catch (err) {
                alert('خطا در ساخت اینباند: ' + err.message);
            }
        });

        // User + access form
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);

            const selectedInboundIds = [...document.querySelectorAll('.inbound-checkbox:checked')]
                .map(x => Number(x.value));

            try {
                // 1) create user
                const userRes = await api('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: data.username, uuid: data.uuid })
                });

                // 2) assign inbounds
                const accessRes = await api(`/api/users/${userRes.id}/inbounds`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inboundIds: selectedInboundIds })
                });

                showResult({ user: userRes, access: accessRes });
                e.target.reset();
                document.querySelectorAll('.inbound-checkbox').forEach(ch => ch.checked = false);
                await refreshAll();
            } catch (err) {
                alert('خطا در ساخت کاربر/دسترسی: ' + err.message);
            }
        });

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('کپی شد ✅');
            } catch (e) {
                alert('کپی نشد ❌');
            }
        }

        refreshAll().catch(err => {
            console.error(err);
            alert('خطا در بارگذاری اولیه: ' + err.message);
        });
    </script>
</body>

</html>
